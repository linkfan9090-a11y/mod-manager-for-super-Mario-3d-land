name: Build 3DS Homebrew

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest
container: devkitpro/devkitarm:latest

steps:
  - name: Check out source
    uses: actions/checkout@v4

  - name: Download official Makefile
    run: |
      curl -fsSL https://raw.githubusercontent.com/devkitPro/3ds-examples/master/templates/application/Makefile -o Makefile
      sed -i 's/^TARGET[[:space:]]*:=.*/TARGET := SM3DLModManager/' Makefile

  - name: Build app
    run: make

  - name: Upload build
    uses: actions/upload-artifact@v4
    with:
      name: SM3DLModManager
      path: |
        *.3dsx
        *.smdh