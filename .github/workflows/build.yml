
name: Build 3DS Homebrew

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build app
        run: make

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SM3DLModManager
          path: |
            *.3dsx
            *.smdh
